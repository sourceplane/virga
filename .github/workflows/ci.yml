name: CI

# Orun convergence: `plan --changed` on every event, `run` per component lane.
# GATED until the product is bootstrapped — set the `ORUN_CI` repository
# variable to `true` once the workspace exists and `intent.yaml` names it.
# Until then `verify.yml` is the merge gate.

on:
  push:
    branches: [main]
  pull_request:

# PR runs share a group per ref and superseded runs are cancelled (each
# push re-plans anyway), which stops stale fan-outs from starving the
# runner pool. Main pushes get a unique group each: convergence runs plan
# --changed per commit, and GitHub replaces *pending* runs in a shared
# group even with cancel-in-progress false — a superseded main run's
# components would silently never converge.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  id-token: write
  checks: write

jobs:
  plan:
    if: ${{ vars.ORUN_CI == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      lane-matrix: ${{ steps.matrix.outputs.lane-matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.78.0
      - env:
          # Surface the best-effort catalog auto-sync (execution.state.autopushCatalog).
          # A successful push prints "✓ pushed catalog …"; ORUN_VERBOSE also makes
          # any skip/failure visible instead of silent.
          ORUN_VERBOSE: "1"
        run: |
          set -euo pipefail

          plan_args=(
            --from-ci github
            --event-file "$GITHUB_EVENT_PATH"
            --intent intent.yaml
            --output plan.json
            --changed
          )

          orun plan "${plan_args[@]}"
      # LANES (orun >= v2.76.0): one GitHub job per LANE, not per orun job.
      # intent.yaml's `execution.lanes` packs the plan; a plan with no `lanes`
      # array falls back to one lane per job, which is what this was before.
      - id: matrix
        run: |
         echo "lane-matrix=$(jq -c 'if ((.lanes // []) | length) > 0
           then [.lanes[] | {"lane": .id, "name": .name}]
           else [.jobs[] | {"lane": .id, "name": .checkName}] end' plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: orun-plan
          path: plan.json

  run:
    needs: plan
    runs-on: ubuntu-latest
    # A BOOTSTRAP BRANCH IS CHECKED BY `plan` ALONE. Every phase of a bootstrap
    # lands as a pull request on an `orun/BASE-…` branch, and its merge runs
    # every lane on main a minute later, for real, watched to green before the
    # next phase. Running the lanes on the PR too was the same work twice and
    # a third of the bootstrap's wall-clock. Any other branch still verifies.
    if: >-
      ${{ needs.plan.outputs.lane-matrix != '[]' && needs.plan.outputs.lane-matrix != ''
          && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'orun/BASE-')) }}
    strategy:
      fail-fast: false
      # Lanes already bound the herd (intent.yaml `execution.lanes`): a plan is
      # packed into at most six per run, so this cap is rarely the limit.
      max-parallel: 16
      matrix:
        include: ${{ fromJson(needs.plan.outputs.lane-matrix) }}
    name: ${{ matrix.name }}
    env:
      npm_config_store_dir: /home/runner/.pnpm-store
      PNPM_STORE_DIR: /home/runner/.pnpm-store
    steps:
      - uses: actions/checkout@v6
      # One pnpm store shared across every lane of a run, keyed on the
      # lockfile: a lane's install is a link, not a download.
      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: orun-plan
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.78.0
      # exec-id is the RUN id alone (no attempt suffix): a `gh run rerun
      # --failed` then RESUMES the same orun execution — jobs that succeeded in
      # a prior attempt stay completed, so re-run lanes' cross-job dependencies
      # are already satisfied instead of waiting forever on lanes that are not
      # re-running (the partial-rerun deadlock). --retry re-opens THIS lane's
      # job when it terminally failed in a prior attempt (no-op on first
      # attempts) — together they make `gh run rerun --failed` a true resume.
      - run: |
          # --retry only on re-run attempts: on a fresh attempt a failed
          # upstream is a genuine failure and dependents must fail fast; on a
          # resume (gh run rerun --failed) the upstream's own retry lane will
          # re-open it, so lanes wait out the race instead.
          retry_flag=""
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then retry_flag="--retry"; fi
          orun run \
            --plan plan.json \
            --runner github-actions \
            --remote-state \
            --lane "${{ matrix.lane }}" \
            --exec-id "${{ github.run_id }}" \
            $retry_flag
        env:
          # GITHUB_TOKEN is the only credential CI holds — GitHub-issued and
          # ephemeral. Every provider credential (the Cloudflare token and
          # account id — this baseline has no second provider) is an
          # orun-managed secret:
          # brokered fresh per run from the workspace's integrations, resolved
          # lease-bound by the jobs that declare it (profile secretBindings or
          # component secretEnv), and log-redacted. Nothing provider-shaped is
          # stored in GitHub.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: /home/runner/.docker
