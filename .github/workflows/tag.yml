name: Baseline tag

# A `baseline-vN` TAG IS CUT BY A WORKFLOW, NEVER MOVED.
#
# A baseline tag is what the platform's registry resolves and what every
# website bootstrapped from this repository is built out of. Two rules, both
# enforced here:
#
#   - the version must look like `baseline-v<N>`;
#   - the tag must not already exist. A baseline tag is never moved, because
#     products resolve it and repointing one changes what a build that already
#     shipped was made of. Cut the next number instead.
#
# ─── WHAT THIS NO LONGER DOES ─────────────────────────────────────────────
#
# Until the 2026-10 sync with cirrus-baseline this workflow refused any commit
# without a green tier-3 rehearsal run, and `testing/tag-gate.sh` carried that
# rule. Virga never had a rehearsal, so the gate answered "cannot be answered"
# for every commit and no tag could ever be cut — and cirrus-baseline removed
# its rehearsal and the gate with it (cirrus-baseline#13). Whether a commit is
# fit to release is decided OUTSIDE this repository: the end-to-end bootstrap
# that proves a published baseline is run from elsewhere, against the tag the
# registry publishes, and the registry row in orun-cloud's
# `infra/baselines-registry/baselines.yaml` moves by pull request.
#
# No ruleset guards `baseline-v*` any more either: the one that did had no
# bypass actor (GitHub refuses the Actions integration on a bypass list), so
# it refused this workflow as surely as it refused a hand push.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The tag to cut, e.g. baseline-v2."
        required: true
        type: string
      ref:
        description: "Branch, tag or sha to cut it from. Defaults to main."
        required: false
        default: main
        type: string

concurrency:
  group: baseline-tag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: the version must look like a baseline tag
        run: |
          set -euo pipefail
          case "${{ inputs.version }}" in
            baseline-v[0-9]*) ;;
            *) echo "✕ '${{ inputs.version }}' is not a baseline-vN tag" >&2; exit 1 ;;
          esac
      - name: resolve the commit
        id: commit
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Cutting ${{ inputs.version }} from ${{ inputs.ref }} = $sha"
      - name: the tag must not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${{ inputs.version }}")"
          if [ "$code" = "200" ]; then
            echo "✕ ${{ inputs.version }} already exists. A baseline tag is never moved:" >&2
            echo "  products resolve it, and repointing one changes what a build that" >&2
            echo "  already shipped was made of. Cut the next number." >&2
            exit 1
          fi
          [ "$code" = "404" ] || { echo "✕ could not check for the tag (HTTP $code)" >&2; exit 1; }
      - name: cut the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -X POST --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs" \
            -d "$(printf '{"ref":"refs/tags/%s","sha":"%s"}' \
                  "${{ inputs.version }}" "${{ steps.commit.outputs.sha }}")"
          echo ""
          echo "✓ ${{ inputs.version }} → ${{ steps.commit.outputs.sha }}"
          echo "  Next: add or move the registry row in orun-cloud's infra/baselines-registry/baselines.yaml."
