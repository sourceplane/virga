apiVersion: sourceplane.io/v1
kind: Intent

metadata:
  name: virga
  description: Reusable Cloudflare-only single-owner website baseline (Workers, D1, KV, Email)
  namespace: sourceplane

execution:
  state:
    backendUrl: https://api-edge-prod.oruncloud.workers.dev
    # Declared, enforced tenancy: the workspace claim is sent on every remote
    # op (including the credential-free CI OIDC exchange) so the platform can
    # enforce claim ⊆ authorized. Declaring it implies strict mode — a
    # non-interactive run that resolves no workspace fails fast.
    #
    # This repository's OWN workspace: `virga`, under the openproduct account.
    # It is not a default for anything built from here — 01-scaffold's
    # `orun-workspace` hook rewrites this line to the product's workspace, and
    # rebrand.mjs rewrites the workspace segment of every `secret://` ref,
    # because a product that inherits this id claims this tenant on every
    # remote op. `testing/placement.test.sh` fails if either stops happening.
    workspace: ws_F6PEAMKD
    requireOrg: true
    # Push the resolved catalog after a successful plan on the default branch,
    # keeping the workspace-global catalog head fresh without an explicit
    # `--push-catalog`.
    autopushCatalog: true
  # Lanes (orun ≥ v2.76.0): CI runs one GitHub job per LANE, not per orun job.
  # Auto mode leaves a plan of up to 6 jobs as one lane per job and packs a
  # bigger one into at most 6 lanes, keeping each environment on its own
  # runners and every dependency chain (db-migrate → the Workers that wait on
  # it) inside one lane. Every job still gets its own check run, named as
  # before, so branch protection is unaffected. Ported from cirrus-baseline.
  lanes:
    mode: auto
    maxLanes: 6
    concurrency: 6

compositions:
  sources:
    # The composition stack lives in sourceplane/stack-tectonic and is consumed
    # as a published OCI artifact rather than a repo-local directory. Pin an
    # explicit version: a bare repository reference resolves to `:latest`,
    # which would let a catalog release change this repo's execution contracts
    # without a commit here. Bumping the tag is the deliberate upgrade step.
    - name: stack-tectonic
      kind: oci
      ref: oci://ghcr.io/sourceplane/stack-tectonic:0.18.1
  resolution:
    precedence:
      - stack-tectonic
    bindings:
      terraform: stack-tectonic
      cloudflare-domain: stack-tectonic
      db-migrate: stack-tectonic

discovery:
  roots:
    - apps/
    - infra/
    - packages/
    - tests/

automation:
  triggerBindings:
    github-pull-request:
      description: Pull request validation
      on:
        provider: github
        event: pull_request
        actions:
          - opened
          - synchronize
          - reopened
          - ready_for_review
        baseBranches:
          - main
      plan:
        scope: changed
        base: pull_request.base.sha
        head: pull_request.head.sha

    github-push-main:
      description: Main branch stack convergence after merge
      on:
        provider: github
        event: push
        branches:
          - main

    local-development:
      description: Local testing with full Terraform execution
      on:
        provider: local

environments:
  dev:
    description: Verify-only. Pull requests plan and verify here; nothing is deployed, so there is no door.
    # dev only ever verifies (no component deploys to it), so nothing in it
    # has to wait for anything: every dev job starts the moment a runner does.
    dependencyMode: advisory
    activation:
      triggerRefs:
        - github-pull-request
        - github-push-main
        - local-development
    parameterDefaults:
      terraform:
        lane: verify
        namespace: sourceplane
        namespacePrefix: dev-
        owner: sourceplane
        repo: virga
        SITE_CUSTOM_DOMAIN: ""
    policies:
      requireApproval: "false"
    env:
      BASE_DOMAIN: virga.site

  stage:
    description: The two Workers and the site, deployed on every merge to main before prod.
    activation:
      triggerRefs:
        - github-pull-request
        - github-push-main
    parameterDefaults:
      terraform:
        lane: verify
        namespace: sourceplane
        namespacePrefix: stg-
        owner: sourceplane
        repo: virga
        SITE_CUSTOM_DOMAIN: stage.virga.site
    policies:
      requireApproval: "false"
    env:
      BASE_DOMAIN: virga.site

  prod:
    description: Where visitors are. Deploys after stage converges on the same commit.
    activation:
      triggerRefs:
        - github-pull-request
        - github-push-main
    promotion:
      dependsOn:
        - environment: stage
    parameterDefaults:
      terraform:
        lane: verify
        namespace: sourceplane
        namespacePrefix: prod-
        owner: sourceplane
        repo: virga
        SITE_CUSTOM_DOMAIN: virga.site
    policies:
      requireApproval: "false"
    env:
      BASE_DOMAIN: virga.site

# Repo-level catalog entity: front page + role-tagged docs (rendered in the
# workspace Docs library, pinned to the commit by `orun plan`).
repo:
  displayName: virga
  docs:
    overview: README.md
    pages:
      - { path: ai/context/operations.md, role: runbook, title: Operating contract }
      - { path: ai/context/deployment.md, role: reference, title: Live deployment manifest }
