apiVersion: orun.dev/v1
kind: Workflow
metadata:
  name: phase-02-foundation
# Phase 2: the package foundation (this folder's blueprint.yaml — the 13
# shared packages and their test components). Verify-only lanes; nothing
# deploys yet, so no provider connections are needed.
# Run from the baseline checkout (local mode: --set out=<product-path>), or
# from ANYWHERE — a fresh container included — by remote ref (headless mode:
# --set repo=<owner/name>; needs GITHUB_TOKEN + ORUN_TOKEN in the env):
#   orun workflow run github:sourceplane/virga@<ref>//flows/phases/02-foundation/workflow.yaml \
#     --set workspace=<ws-id> --set repo=<owner/name>
# The baseline content is fetched at the SAME commit the flow came from
# (ORUN_FLOW_SOURCE_SHA), so one remote reference pins everything.
inputs:
  workspace:
    type: string
    description: Workspace id (ws_…) or slug this product deploys against.
  out:
    type: string
    default: ""
    description: Product repo path (local checkout mode). Leave empty in headless mode.
  repo:
    type: string
    default: ""
    description: Product repo as owner/name — headless mode clones it (requires GITHUB_TOKEN/GH_TOKEN).
  baselineref:
    type: string
    default: ""
    description: Baseline git ref to fetch when no local checkout exists. Empty = the commit this flow was fetched from (ORUN_FLOW_SOURCE_SHA), else main.
  watch:
    type: string
    default: "true"
    description: '"false" skips watching the CI convergence (use when this environment cannot observe GitHub Actions; converge state must then be verified out-of-band). Later steps (restore/verify) proceed.'
  dryrun:
    type: string
    default: "false"
    description: '"true" previews the phase (blueprint applied + shown + reverted, no PR, no deploy).'
steps:
  - name: apply
    envInherit: [GITHUB_TOKEN, GH_TOKEN, ORUN_TOKEN, ORUN_TOKEN_FILE, GH_REPO, GH_HOST, ORUN_BACKEND_URL]
    run:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # ── context: baseline (local checkout, or self-pinned fetch) ──
        if BL="$(git rev-parse --show-toplevel 2>/dev/null)" && [ -f "$BL/repo-blueprint.yaml" ] && [ -d "$BL/flows/phases" ]; then
          L="$BL"
        else
          # Steps run in the exec-specific wfruns dir — anchor shared content
          # one level up so baseline/ and product/ persist across phases.
          case "$PWD" in */.orun/wfruns/*) W="${PWD%%/.orun/wfruns/*}" ;; *) W="$PWD" ;; esac
          L="$W/baseline"
          brepo="${ORUN_FLOW_SOURCE_REPO:-sourceplane/virga}"
          bref="{{ inputs.baselineref }}"
          [ -n "$bref" ] || bref="${ORUN_FLOW_SOURCE_SHA:-main}"
          # Fetch when the baseline is absent, partial, or at a DIFFERENT
          # commit than the pinned ref — a stale reuse would silently apply
          # old content against a new flow. Every git step is rerun-safe
          # (remote add falls back to set-url; failures print before exiting
          # — a bare exit-1 here surfaced as an empty error, hit live).
          if [ "$(git -C "$L" rev-parse HEAD 2>/dev/null)" != "$bref" ]; then
            echo "fetching baseline $brepo@$bref"
            git init -q "$L" 2>/dev/null || true
            git -C "$L" remote add origin "https://github.com/$brepo" 2>/dev/null \
              || git -C "$L" remote set-url origin "https://github.com/$brepo"
            git -C "$L" -c credential.helper= -c 'credential.helper=!f(){ [ "$1" = get ] && exec gh auth git-credential get; :; }; f' -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth 1 origin "$bref" \
              || { echo "baseline fetch FAILED for $brepo@$bref — check repo access (gh auth) and the ref"; exit 1; }
            git -C "$L" checkout -q --detach FETCH_HEAD \
              || { echo "baseline checkout FAILED (FETCH_HEAD missing?)"; exit 1; }
          fi
        fi
        . "$L/flows/common/ctx.sh" "{{ inputs.workspace }}" "{{ inputs.repo }}" "{{ inputs.out }}"
        "$L/flows/common/apply-blueprint.sh" "$L" flows/phases/02-foundation/blueprint.yaml "$P" "$ws" "{{ inputs.dryrun }}"
    timeout: 15m
  - name: land
    needs: [apply]
    envInherit: [GITHUB_TOKEN, GH_TOKEN, ORUN_TOKEN, ORUN_TOKEN_FILE, GH_REPO, GH_HOST, ORUN_BACKEND_URL]
    run:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # ── context: baseline (local checkout, or self-pinned fetch) ──
        if BL="$(git rev-parse --show-toplevel 2>/dev/null)" && [ -f "$BL/repo-blueprint.yaml" ] && [ -d "$BL/flows/phases" ]; then
          L="$BL"
        else
          # Steps run in the exec-specific wfruns dir — anchor shared content
          # one level up so baseline/ and product/ persist across phases.
          case "$PWD" in */.orun/wfruns/*) W="${PWD%%/.orun/wfruns/*}" ;; *) W="$PWD" ;; esac
          L="$W/baseline"
          if [ ! -e "$L/.git" ]; then
            brepo="${ORUN_FLOW_SOURCE_REPO:-sourceplane/virga}"
            bref="{{ inputs.baselineref }}"
            [ -n "$bref" ] || bref="${ORUN_FLOW_SOURCE_SHA:-main}"
            echo "fetching baseline $brepo@$bref"
            git init -q "$L"
            git -C "$L" remote add origin "https://github.com/$brepo"
            git -C "$L" -c credential.helper= -c 'credential.helper=!f(){ [ "$1" = get ] && exec gh auth git-credential get; :; }; f' -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth 1 origin "$bref"
            git -C "$L" checkout -q FETCH_HEAD
          fi
        fi
        . "$L/flows/common/ctx.sh" "{{ inputs.workspace }}" "{{ inputs.repo }}" "{{ inputs.out }}"
        [ "{{ inputs.dryrun }}" = "true" ] && { echo "DRY RUN: skipping PR/merge"; exit 0; }
        # --no-wait: the packages come from the PINNED baseline, already verified
        # there; the converge step re-runs the same verify lanes on main and is
        # the real gate. Waiting on the PR lanes just runs every build twice.
        "$L/flows/common/land-pr.sh" --no-wait "$P" 02-foundation "phase(02-foundation): shared packages"
    timeout: 30m
  - name: converge
    needs: [land]
    envInherit: [GITHUB_TOKEN, GH_TOKEN, ORUN_TOKEN, ORUN_TOKEN_FILE, GH_REPO, GH_HOST, ORUN_BACKEND_URL]
    run:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # ── context: baseline (local checkout, or self-pinned fetch) ──
        if BL="$(git rev-parse --show-toplevel 2>/dev/null)" && [ -f "$BL/repo-blueprint.yaml" ] && [ -d "$BL/flows/phases" ]; then
          L="$BL"
        else
          # Steps run in the exec-specific wfruns dir — anchor shared content
          # one level up so baseline/ and product/ persist across phases.
          case "$PWD" in */.orun/wfruns/*) W="${PWD%%/.orun/wfruns/*}" ;; *) W="$PWD" ;; esac
          L="$W/baseline"
          if [ ! -e "$L/.git" ]; then
            brepo="${ORUN_FLOW_SOURCE_REPO:-sourceplane/virga}"
            bref="{{ inputs.baselineref }}"
            [ -n "$bref" ] || bref="${ORUN_FLOW_SOURCE_SHA:-main}"
            echo "fetching baseline $brepo@$bref"
            git init -q "$L"
            git -C "$L" remote add origin "https://github.com/$brepo"
            git -C "$L" -c credential.helper= -c 'credential.helper=!f(){ [ "$1" = get ] && exec gh auth git-credential get; :; }; f' -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth 1 origin "$bref"
            git -C "$L" checkout -q FETCH_HEAD
          fi
        fi
        . "$L/flows/common/ctx.sh" "{{ inputs.workspace }}" "{{ inputs.repo }}" "{{ inputs.out }}"
        [ "{{ inputs.dryrun }}" = "true" ] && { echo "DRY RUN: would watch the main convergence run (resume budget 3)"; exit 0; }
        [ "{{ inputs.watch }}" = "false" ] && { echo "watch=false: NOT watching the convergence — verify the run out-of-band before trusting later phases"; exit 0; }
        cd "$P"
        "$L/flows/common/converge.sh" '' 3
    timeout: 45m
