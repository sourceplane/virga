# Task contract template for the 04-mail landing.
# Unbound to a key on purpose: `orun task create --contract` seals and
# attaches it to the key the allocator issues. gates: [] is a DECLARATION —
# merge alone finishes this task; the main convergence is the gate the phase
# WATCHES, not one the plane observes as a PR check.
apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The D1 schema is applied and the internal mail Worker — transactional email and newsletter broadcasts — is deployed on stage and prod
  affects:
    - db-migrate
    - mail-worker
    - mail-worker-tests
  doneWhen:
    - every migration applied to the stage and prod databases
    - mail-worker deployed on stage and prod
  gates: []
