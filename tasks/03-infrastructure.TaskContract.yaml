# Task contract template for the 03-infrastructure landing.
# Unbound to a key on purpose: `orun task create --contract` seals and
# attaches it to the key the allocator issues. gates: [] is a DECLARATION —
# merge alone finishes this task; the main convergence is the gate the phase
# WATCHES, not one the plane observes as a PR check.
apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The data plane — D1 and KV — is provisioned on stage and prod and its outputs published
  affects:
    - cloudflare-d1
    - cloudflare-kv
  doneWhen:
    - WIRING_CLOUDFLARE_D1 and WIRING_CLOUDFLARE_KV published on stage and prod
  gates: []
