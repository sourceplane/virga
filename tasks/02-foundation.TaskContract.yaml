# Task contract template for the 02-foundation landing.
# Unbound to a key on purpose: `orun task create --contract` seals and
# attaches it to the key the allocator issues. gates: [] is a DECLARATION —
# merge alone finishes this task; the main convergence is the gate the phase
# WATCHES, not one the plane observes as a PR check.
apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The five shared packages — contracts, db, shared, testing, cli — are on main with their verify lanes green
  affects:
    - contracts
    - db
    - shared
    - testing
    - cli
    - db-tests
    - cli-tests
  doneWhen:
    - every package's verify lane green on main
  gates: []
