apiVersion: orun.dev/v1
kind: Blueprint
metadata:
  name: virga-baseline
  description: >-
    Virga as a Blueprint of itself — instantiate a new single-owner website
    repo (launch directory, newsletter, portfolio) from the Virga baseline.
    Eight phases take a product from nothing to a live, documented site. Run
    one at a time with `--phase <name>` or the whole sequence with
    `--resume`; see docs/phases/README.md for the contract every phase
    follows, and BOOTSTRAP.md for the operator checklist no script can
    perform.

# ── INPUTS ────────────────────────────────────────────────────────────────
# The instance-identity contract, consumed by tooling/rebrand/rebrand.mjs via
# the `.rebrand/values.json` the `rebrand-values` module templates. Key names
# are rebrand.mjs's own (camelCase) and blueprint.yaml's card declares the
# same ones — testing/manifest.test.sh fails if the two ever drift.
#
# Org-owned identity (the orun state backend, the `sourceplane.io`
# apiVersion) is intentionally NOT an input — the rebrand tool protects it.
# `orunWorkspace` is the one exception and is re-tenanted by its own hook,
# because a product whose CI claims the baseline's workspace is a product
# claiming another tenant.
inputs:
  repoName:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    required: true
    description: Repo slug (e.g. acme-blog) — intent metadata.name, D1 database names, worker resource prefixes.
  productName:
    type: string
    required: true
    description: Human display name (e.g. "Acme Blog") — the site's name and the deploy smoke marker.
  productDomain:
    type: string
    required: true
    description: Product domain (e.g. acme.blog) — BASE_DOMAIN, custom domains, the mail sending subdomain.
  githubOrg:
    type: string
    required: true
    description: >-
      GitHub owner the product repo is created under. 01-scaffold waits for
      the App installation on THIS owner before it creates anything: the
      platform learns of a pull request only through the installation on the
      account that owns the repository, so a workspace connected to some
      other account would pass "github is connected" and then file none of
      the product's landings.
  brandSlug:
    type: string
    default: ""
    description: Cloudflare worker resource prefix (default repoName).
  cliBin:
    type: string
    default: ""
    description: CLI binary name + env-var prefix source (default repoName).
  workersDevSubdomain:
    type: string
    default: "your-workers-subdomain"
    description: workers.dev subdomain, used by the site build and by every deploy smoke and probe.
  repoPrivate:
    type: bool
    default: true
    description: Whether orun.repo/ensure creates the product repo private. Visibility is the operator's choice, so it is asked rather than assumed.
  orunWorkspace:
    type: string
    default: ""
    description: >-
      Orun Cloud workspace ID (ws_…) for this instance's remote state. Unset,
      it is the workspace the build runs in (`from: workspace`); with none
      anywhere, 01-scaffold writes a placeholder that fails loudly rather
      than silently cross-tenanting.
    from: workspace
  epicSlug:
    type: string
    default: "site-baselining"
    description: >-
      The epic every phase clubs its task under. Found by slug, so a fresh
      run and a resumed run find the same work.
  domain:
    type: bool
    default: false
    description: >-
      Whether to run 07-domain. It needs the Cloudflare zone to already
      exist, so it is off unless asked for; the phase carries the condition
      as its own `when:`.

# ── SOURCES ───────────────────────────────────────────────────────────────
sources:
  - name: baseline
    kind: dir
    path: .

# Derived build output, and the factory's own files, that the baseline must
# never carry into an instance.
#
# WHAT `ignore` ACTUALLY EXCLUDES: orun matches an entry two ways, and which
# one depends on the entry. A pattern with no glob metacharacter is compared
# against each path SEGMENT; only a pattern containing one is compared against
# the whole relative path. So `apps/site-api/wrangler.jsonc` on its own would
# match nothing — it needs the glob. testing/coverage.test.sh asserts this for
# every entry here rather than trusting the reading.
ignore:
  - dist
  - coverage
  - .turbo
  - .next
  - .open-next
  - .wrangler
  - node_modules
  # Locally-rendered, gitignored artifacts: `orun new` snapshots the working
  # tree, not the git index, so without these it would copy whatever the
  # operator happens to have built — and an instance would ship with the
  # BASELINE's resolved binding IDs baked in.
  - "**/apps/*/wrangler.jsonc"
  - "*.tsbuildinfo"
  # THE FACTORY'S OWN LANES. `github-workflows` copies the whole of `.github`,
  # so without these two entries every product built from this baseline would
  # carry them — and they run `testing/*.sh`, which no module places. Four
  # steps that cannot pass, red on the product's first pull request, in a
  # repository whose owner has no idea what a blueprint is.
  # testing/coverage.test.sh fails if a lane reading `testing/` is not here.
  - "**/.github/workflows/baseline.yml"
  - "**/.github/workflows/tag.yml"

# ── MODULES ───────────────────────────────────────────────────────────────
# One module per component (or per root file), with dependsOn edges transcribed
# from the component manifests: declared dependsOn, service bindings, wiring
# components, workspace package deps, and tests-follow-subject.
#
# The root is split into single-file modules rather than one module with an
# `include:` list. That is not cosmetic. The include form placed `ai/`,
# `specs/`, `flows/`, `BOOTSTRAP.md` and both blueprints into every product —
# so every site built from this baseline shipped this repository's planning
# state and the whole factory. testing/leak.test.sh now fails on exactly that.
modules:
  # ── the identity file every later phase reads back ───────────────────────
  - name: rebrand-values
    mode: template
    files:
      ".rebrand/values.json": |
        {
          "repoName": "{{ .repoName }}",
          "productName": "{{ .productName }}",
          "productDomain": "{{ .productDomain }}"{{ if .brandSlug }},
          "brandSlug": "{{ .brandSlug }}"{{ end }}{{ if .cliBin }},
          "cliBin": "{{ .cliBin }}"{{ end }},
          "workersDevSubdomain": "{{ .workersDevSubdomain }}",
          "orunWorkspace": "{{ .orunWorkspace }}",
          "githubOrg": "{{ .githubOrg }}",
          "epicSlug": "{{ .epicSlug }}",
          "domain": {{ if .domain }}true{{ else }}false{{ end }}
        }

  # ── root files (single-file copies). intent.yaml, package.json et al. carry
  #    instance identity; they are copied verbatim and rewritten in place by
  #    the `rebrand` hook — its rename map is the authority, not a template.
  - name: root-intent
    mode: copy
    source: baseline
    from: intent.yaml
    to: intent.yaml
  - name: root-package-json
    mode: copy
    source: baseline
    from: package.json
    to: package.json
  - name: root-pnpm-workspace
    mode: copy
    source: baseline
    from: pnpm-workspace.yaml
    to: pnpm-workspace.yaml
  - name: root-pnpm-lock
    mode: copy
    source: baseline
    from: pnpm-lock.yaml
    to: pnpm-lock.yaml
  - name: root-turbo
    mode: copy
    source: baseline
    from: turbo.json
    to: turbo.json
  - name: root-kiox
    mode: copy
    source: baseline
    from: kiox.yaml
    to: kiox.yaml
  - name: root-kiox-lock
    mode: copy
    source: baseline
    from: kiox.lock
    to: kiox.lock
  - name: root-gitignore
    mode: copy
    source: baseline
    from: .gitignore
    to: .gitignore
  - name: root-readme
    mode: copy
    source: baseline
    from: README.md
    to: README.md
  - name: github-workflows
    mode: copy
    source: baseline
    from: .github
    to: .github

  # The two context pages a product genuinely owns: its operating contract and
  # the deployment manifest 08-docs writes. Named one file at a time, because
  # copying `ai/context/` wholesale is how a product came to ship the
  # baseline's decisions, open risks and provenance.
  - name: ai-operations
    mode: copy
    source: baseline
    from: ai/context/operations.md
    to: ai/context/operations.md
  - name: ai-deployment
    mode: copy
    source: baseline
    from: ai/context/deployment.md
    to: ai/context/deployment.md

  # ── the empty discovery roots, declared ──────────────────────────────────
  #    orun's repo-scale gate — and later `orun plan` in the product's own CI
  #    — discovers apps/, infra/, packages/ and tests/, which by design are
  #    empty until later phases fill them. A missing root is a hard gate
  #    failure, so this used to be a mkdir in a shell preamble. A file the
  #    tree needs in order to be valid is what a module is for.
  - name: discovery-roots
    mode: template
    files:
      "apps/.gitkeep": ""
      "infra/.gitkeep": ""
      "packages/.gitkeep": ""
      "tests/.gitkeep": ""

  # ── shared tooling ───────────────────────────────────────────────────────
  - name: tooling-tsconfig
    mode: copy
    source: baseline
    from: tooling/tsconfig
    to: tooling/tsconfig
  - name: tooling-eslint
    mode: copy
    source: baseline
    from: tooling/eslint
    to: tooling/eslint
  - name: tooling-wire
    mode: copy
    source: baseline
    from: tooling/wire
    to: tooling/wire

  # ── shared packages ──────────────────────────────────────────────────────
  - name: shared
    mode: copy
    source: baseline
    from: packages/shared
    to: packages/shared
    dependsOn: [tooling-eslint, tooling-tsconfig]
  - name: contracts
    mode: copy
    source: baseline
    from: packages/contracts
    to: packages/contracts
    dependsOn: [tooling-eslint, tooling-tsconfig]
  - name: db
    mode: copy
    source: baseline
    from: packages/db
    to: packages/db
    dependsOn: [tooling-eslint, tooling-tsconfig]
  - name: testing
    mode: copy
    source: baseline
    from: packages/testing
    to: packages/testing
    dependsOn: [contracts, db]
  - name: cli
    mode: copy
    source: baseline
    from: packages/cli
    to: packages/cli
    dependsOn: [contracts]
  - name: db-tests
    mode: copy
    source: baseline
    from: tests/db
    to: tests/db
    dependsOn: [db, testing]
  - name: cli-tests
    mode: copy
    source: baseline
    from: tests/cli
    to: tests/cli
    dependsOn: [cli, contracts]

  # ── infrastructure ───────────────────────────────────────────────────────
  - name: cloudflare-d1
    mode: copy
    source: baseline
    from: infra/terraform/cloudflare-d1
    to: infra/terraform/cloudflare-d1
  - name: cloudflare-kv
    mode: copy
    source: baseline
    from: infra/terraform/cloudflare-kv
    to: infra/terraform/cloudflare-kv
  - name: db-migrate
    mode: copy
    source: baseline
    from: infra/db-migrate
    to: infra/db-migrate
    dependsOn: [cloudflare-d1, db]
  - name: cloudflare-domain
    mode: copy
    source: baseline
    from: infra/terraform/cloudflare-domain
    to: infra/terraform/cloudflare-domain

  # ── workers ──────────────────────────────────────────────────────────────
  - name: mail-worker
    mode: copy
    source: baseline
    from: apps/mail-worker
    to: apps/mail-worker
    dependsOn: [cloudflare-d1, contracts, db, shared, db-migrate]
  - name: mail-worker-tests
    mode: copy
    source: baseline
    from: tests/mail-worker
    to: tests/mail-worker
    dependsOn: [mail-worker, contracts, db, testing]
  - name: site-api
    mode: copy
    source: baseline
    from: apps/site-api
    to: apps/site-api
    dependsOn: [cloudflare-d1, cloudflare-kv, contracts, db, shared, db-migrate, mail-worker]
  - name: site-api-tests
    mode: copy
    source: baseline
    from: tests/site-api
    to: tests/site-api
    dependsOn: [site-api, contracts, db, testing]

  # ── the site ─────────────────────────────────────────────────────────────
  - name: web-site
    mode: copy
    source: baseline
    from: apps/web-site
    to: apps/web-site
    dependsOn: [contracts, site-api]
  - name: web-site-tests
    mode: copy
    source: baseline
    from: tests/web-site
    to: tests/web-site
    dependsOn: [web-site, contracts]

# ── THE WORK, UP FRONT ────────────────────────────────────────────────────
# THE BOOTSTRAP IS WORK, SO IT LIVES WHERE WORK LIVES — and all of it is on
# the plane before the first phase places a file. One epic, one milestone per
# phase in the order the phases run, one task per landing: the whole programme
# a reader can open while 01-scaffold is still creating the repository,
# instead of a row appearing each time a phase was reached.
#
# `hooks.preInstantiate` (orun >= v2.60) runs under no phase, once per run, on
# a resume too. Everything here is find-or-create BY IDENTITY — the epic by
# slug, a milestone by name within its epic, a task by title within its epic —
# so a second run, a resume and a redo all find what the first run made. That
# is also why the milestones are created here IN ORDER and BEFORE the tasks:
# the plane appends each new milestone after the last, and a task that names a
# milestone the epic does not yet have would create it out of order at the end.
#
# Each phase's own `pre` hook still runs `orun.task/ensure@v1` on its task.
# That is the same identity, so it finds rather than creates, and it is how the
# phase gets the task's KEY for its landing — `{{ .phase.name }}` renders empty
# here, and the outputs of a run-level hook are not a phase's to read.
hooks:
  preInstantiate:
    - id: epic
      uses: orun.task/ensure@v1
      with:
        kind: epic
        slug: "{{ .inputs.epicSlug }}"
        name: "Site baselining — {{ .inputs.productName }}"
        description: >-
          Everything the Virga baseline builds for {{ .inputs.productName }}
          in {{ .inputs.githubOrg }}/{{ .inputs.repoName }}: the repository,
          the shared packages, the D1 and KV data plane, the mail Worker, the
          public site API, the Next.js site, the custom domain when one is
          asked for, and the record of what went live. One milestone per
          phase, in the order the phases run; one task per landing, each
          bound to the pull request that lands it.
        owner: me

    - id: m01
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 01-scaffold
        exitCriteria:
          - repository created under {{ .inputs.githubOrg }} and linked to the workspace
          - the scaffold merged, main pinned as the default branch
    - id: m02
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 02-foundation
        exitCriteria:
          - the five shared packages on main, their verify lanes green
    - id: m03
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 03-infrastructure
        exitCriteria:
          - WIRING_CLOUDFLARE_D1 and WIRING_CLOUDFLARE_KV published on stage and prod
    - id: m04
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 04-mail
        exitCriteria:
          - the migration runner applied and the mail Worker deployed on stage and prod
    - id: m05
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 05-api
        exitCriteria:
          - site-api /health 200 on stage and prod
    - id: m06
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 06-site
        exitCriteria:
          - the site answers on stage and prod, its content routes prerendered
    - id: m07
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 07-domain
        exitCriteria:
          - the custom domain resolves to the site on prod
    - id: m08
      uses: orun.task/ensure@v1
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 08-docs
        exitCriteria:
          - the committed deployment manifest matches probed reality

    # One task per landing. Same identity the phases' own `task` hooks use
    # (title within the epic), so those FIND these rather than creating.
    - id: t01
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 01-scaffold
        name: "Scaffold the product repository"
        prefix: SITE
        contract: tasks/01-scaffold.TaskContract.yaml
    - id: t02
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 02-foundation
        name: "Land the shared packages"
        prefix: SITE
        contract: tasks/02-foundation.TaskContract.yaml
    - id: t03
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 03-infrastructure
        name: "Provision the D1 and KV data plane"
        prefix: SITE
        contract: tasks/03-infrastructure.TaskContract.yaml
    - id: t04
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 04-mail
        name: "Deploy the migration runner and the mail Worker"
        prefix: SITE
        contract: tasks/04-mail.TaskContract.yaml
    - id: t05
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 05-api
        name: "Deploy the public site API"
        prefix: SITE
        contract: tasks/05-api.TaskContract.yaml
    - id: t06
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 06-site
        name: "Deploy the website"
        prefix: SITE
        contract: tasks/06-site.TaskContract.yaml
    - id: t07
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 07-domain
        name: "Attach the custom domain"
        prefix: SITE
        contract: tasks/07-domain.TaskContract.yaml
    - id: t08
      uses: orun.task/ensure@v1
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 08-docs
        name: "Record the live deployment"
        prefix: SITE
        contract: tasks/08-docs.TaskContract.yaml

# ── PHASES ────────────────────────────────────────────────────────────────
# Eight selections on this one artifact. The phase NUMBER is the execution
# order, `requires.phases` states it in the document, and the engine refuses a
# phase whose predecessor is not placed — naming it. Each phase follows the
# same contract: place its modules → land them as a PR (merged immediately,
# the convergence is the gate) → watch the convergence → verify it is
# actually deployed.
#
# THERE IS NO `-restore` PHASE HERE, and that is Virga's shape rather than an
# omission. Cirrus strips and restores service bindings across two worker
# landings because its fleet's bindings are cyclic — a worker cannot deploy
# against a service that does not exist yet, and in a cycle none of them can
# go first. Virga has exactly one binding, site-api → MAIL_WORKER, and it
# points backwards: 04-mail lands the mail Worker, 05-api lands the site API
# against it. A one-directional edge needs no cycle broken, so
# tooling/bootstrap/cycle-break.mjs has no job in this baseline and is not
# carried.
phases:
  - name: 01-scaffold
    title: The repo is born
    description: Root manifests, tooling, CI, the identity file, and the empty discovery roots.
    expectedMinutes: 2
    narrate:
      start:  "Creating the repository and writing its foundations — intent, CI, tooling, and the identity every later phase reads back. About {{ .meta.expectedMinutes }} minutes."
      await:  "Waiting for the first push to settle on main."
      done:   "{{ .inputs.repoName }} exists on GitHub with {{ .meta.files }} files on main, branded as {{ .inputs.productName }}. That took {{ .meta.elapsed }}."
      failed: "The repository did not get off the ground. The log above says where it stopped."
    modules: [ai-deployment, ai-operations, discovery-roots, github-workflows, rebrand-values, root-gitignore, root-intent, root-kiox, root-kiox-lock, root-package-json, root-pnpm-lock, root-pnpm-workspace, root-readme, root-turbo, tooling-eslint, tooling-tsconfig, tooling-wire]
    # THE PLATFORM MUST BE ABLE TO SEE THE REPOSITORY BEFORE IT EXISTS. Every
    # phase lands a pull request that files under its task, and the platform
    # learns of a PR only through the GitHub App installation on the account
    # that OWNS the repository. So the owner's connection is asked for here,
    # before a repository is created, and waited for like any other consent.
    requires:
      probe:
        - id: github
          uses: orun.doctor/check@v1
          with:
            providers: [github]
            githubOwner: "{{ .inputs.githubOrg }}"
            waitSeconds: 600
            pollSeconds: 20
    hooks:
      pre:
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Scaffold the product repository"
            prefix: SITE
            contract: tasks/01-scaffold.TaskContract.yaml
      # The identity chain. rebrand.mjs enumerates the tree with
      # `git ls-files`, so the output has to be a git repo with a populated
      # index BEFORE it runs. `git add -A` only stages; the landing commits.
      post:
        - id: git-init
          run: ["git", "init", "-q"]
        - id: git-stage
          run: ["git", "add", "-A"]
        - id: rebrand
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--values", ".rebrand/values.json", "--allow-dirty"]
        # Re-tenant the fork. rebrand.mjs classifies the orun state backend as
        # org-owned and deliberately leaves it untouched, so intent.yaml would
        # keep the BASELINE's `workspace:` — the fork's CI would then claim
        # another tenant's workspace on every remote op. Hook argv is not
        # templated, so the value travels through .rebrand/values.json, which
        # IS a rendered template.
        - id: orun-workspace
          run:
            - node
            - -e
            - |
              const fs = require("fs");
              const values = JSON.parse(fs.readFileSync(".rebrand/values.json", "utf8"));
              const ws = String(values.orunWorkspace || "").trim() || "ws_SET_ME";
              const before = fs.readFileSync("intent.yaml", "utf8");
              const after = before.replace(/^(\s*workspace:\s*).*$/m, "$1" + ws);
              if (after === before) {
                console.error("orun-workspace: no `workspace:` line in intent.yaml — refusing to guess");
                process.exit(1);
              }
              fs.writeFileSync("intent.yaml", after);
              console.log(
                ws === "ws_SET_ME"
                  ? "orun-workspace: wrote placeholder ws_SET_ME — set your Orun Cloud workspace before enabling remote state"
                  : "orun-workspace: intent.yaml workspace -> " + ws,
              );
        # Re-stage so `git ls-files` and `rebrand --verify` see the rewritten tree.
        - id: git-restage
          run: ["git", "add", "-A"]
        - id: rebrand-verify
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--verify", "--values", ".rebrand/values.json"]
        - id: pnpm-lockfile
          run: ["pnpm", "install", "--lockfile-only"]
        # The repo has to exist before there is anywhere to land.
        - id: repo
          uses: orun.repo/ensure@v1
          narrate: "The repository exists at {{ .inputs.githubOrg }}/{{ .inputs.repoName }}."
          with:
            owner: "{{ .inputs.githubOrg }}"
            name: "{{ .inputs.repoName }}"
            private: "{{ .inputs.repoPrivate }}"
        - id: land
          uses: orun.pr/land@v1
          narrate: "The scaffold PR is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "feat(scaffold): the repository is born"
            repo: "{{ .inputs.githubOrg }}/{{ .inputs.repoName }}"

  - name: 02-foundation
    title: The shared packages
    description: contracts, db, shared, testing and the CLI, with their own test suites.
    expectedMinutes: 6
    narrate:
      start:  "The shared packages now — contracts, the D1 data access, the CLI. Nothing deploys in this phase; it is what everything later is built out of."
      await:  "Waiting for the packages' verify lanes."
      done:   "The five shared packages are on main with their verify lanes green. {{ .meta.elapsed }}."
      failed: "A package did not build. The verify lane above names the file."
    modules: [shared, contracts, db, testing, cli, db-tests, cli-tests]
    requires:
      phases: [01-scaffold]
    hooks:
      pre:
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Land the shared packages"
