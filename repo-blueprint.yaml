  - name: 03-infrastructure
    title: The data infrastructure
    description: A D1 database and a KV namespace per environment, their ids published as wiring secrets.
    expectedMinutes: 3
    narrate:
      start:  "Now the data layer — a D1 database and a KV namespace per environment. This is the first phase that touches Cloudflare."
      await:  "Terraform is applying. D1 and KV create in seconds; the wait is the convergence run around them."
      done:   "D1 and KV exist on stage and prod, and their ids are published as wiring secrets for the Workers to read. {{ .meta.elapsed }}."
      failed: "The data layer did not come up. The convergence log above carries the provider's own error."
    modules: [cloudflare-d1, cloudflare-kv]
    requires:
      phases: [02-foundation]
      probe:
        - id: providers
          uses: orun.doctor/check@v1
          with:
            providers: [github, cloudflare]
            githubOwner: "{{ .inputs.githubOrg }}"
            waitSeconds: 600
            pollSeconds: 20
    hooks:
      pre:
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Provision the D1 and KV data plane"
            prefix: SITE
            contract: tasks/03-infrastructure.TaskContract.yaml
        # Brokered, never held: each key is a pointer at the ACTIVE Cloudflare
        # connection and a scope template. Keys that exist are KEPT; missing
        # ones are minted. The d1-edit mint is refused unless the account
        # token's permission groups include D1 Write — see BOOTSTRAP.md.
        - id: secret-workers-deploy
          uses: orun.integrations/reconcile@v1
          with:
            provider: cloudflare
            keys: [CLOUDFLARE_API_TOKEN]
            template: workers-deploy
        - id: secret-d1-edit
          uses: orun.integrations/reconcile@v1
          with:
            provider: cloudflare
            keys: [CLOUDFLARE_D1_TOKEN]
            template: d1-edit
        - id: secret-account-id
          uses: orun.integrations/reconcile@v1
          with:
            provider: cloudflare
            keys: [CLOUDFLARE_ACCOUNT_ID]
            template: account-id
      post:
        - id: retouch
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/retouch.mjs", "--phase", "{{ .phase.name }}", "--affects", "{{ .baseline.dir }}/tasks/03-infrastructure.TaskContract.yaml"]
        - id: stage
          run: ["git", "add", "-A"]
        - id: rebrand
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--values", ".rebrand/values.json", "--allow-dirty"]
        - id: restage
          run: ["git", "add", "-A"]
        - id: rebrand-verify
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--verify", "--values", ".rebrand/values.json"]
        - id: pnpm-lockfile
          run: ["pnpm", "install", "--lockfile-only"]
        - id: land
          uses: orun.pr/land@v1
          narrate: "The infrastructure PR is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "feat(infrastructure): D1 and KV on stage and prod"
            repo: "{{ .inputs.githubOrg }}/{{ .inputs.repoName }}"
      await:
        - id: converge
          uses: orun.run/watch@v1
          narrate: "Terraform applied and the convergence run came back green."
          with:
            sha: "{{ .phase.hooks.land.outputs.mergeSha }}"
            repo: "{{ .inputs.githubOrg }}/{{ .inputs.repoName }}"
            resumeBudget: 3
            waitSeconds: 1800
        - id: verify
          uses: orun.secrets/exists@v1
          narrate: "The wiring secrets the Workers read are published on stage and prod."
          with:
            keys: [WIRING_CLOUDFLARE_D1, WIRING_CLOUDFLARE_KV]
            project: "{{ .inputs.repoName }}"
            environments: [stage, prod]

  - name: 04-mail
    title: The migration runner and the mail Worker
    description: The D1 schema applied, and the internal mail Worker the site API binds to.
    expectedMinutes: 12
    narrate:
      start:  "The schema and the mail Worker. The migration runner applies every migration to the databases phase three created, then the mail Worker deploys against them."
      await:  "Waiting for the migrations to apply and the mail Worker to deploy on both environments."
      done:   "The schema is applied and the mail Worker is deployed on stage and prod. {{ .meta.elapsed }}."
      failed: "The schema or the mail Worker did not land. The convergence log above says which."
    modules: [db-migrate, mail-worker, mail-worker-tests]
    requires:
      phases: [03-infrastructure]
      # The Workers read their D1 and KV ids from the wiring secrets phase
      # three published. A consent nobody has clicked is a WAIT, not a
      # failure, and so is a secret not yet published.
      secrets:
        - id: wiring
          uses: orun.secrets/exists@v1
          with:
            keys: [WIRING_CLOUDFLARE_D1, WIRING_CLOUDFLARE_KV]
            project: "{{ .inputs.repoName }}"
            environments: [stage, prod]
            waitSeconds: 600
            pollSeconds: 20
    hooks:
      pre:
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Deploy the migration runner and the mail Worker"
            prefix: SITE
            contract: tasks/04-mail.TaskContract.yaml
      post:
