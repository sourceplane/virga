  - name: 08-docs
    title: The deployment, recorded
    description: The live-deployment manifest and operating contract, rendered from probed reality.
    expectedMinutes: 3
    narrate:
      start:  "The last phase writes down what actually went live — rendered from the deployment, not from this document."
      await:  "Probing every live URL one more time."
      done:   "The deployment is recorded and every URL answered. {{ .meta.elapsed }}."
      failed: "The record could not be written, or a URL stopped answering. The probe above says which."
    # This phase places no module: its content is RENDERED from the live
    # deployment by the hook below, so there is nothing in the baseline to
    # copy. `ai/context/deployment.md` was placed empty by 01-scaffold and is
    # filled in here.
    modules: []
    requires:
      phases: [06-site]
    hooks:
      pre:
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Record the live deployment"
            prefix: SITE
            contract: tasks/08-docs.TaskContract.yaml
      post:
        - id: render
          run: ["bash", "{{ .baseline.dir }}/hooks/render-deployment-docs.sh", ".", "{{ .inputs.orunWorkspace }}", "{{ .baseline.dir }}"]
        - id: land
          uses: orun.pr/land@v1
          narrate: "The deployment record is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "docs(deployment): record the live deployment state"
            repo: "{{ .inputs.githubOrg }}/{{ .inputs.repoName }}"
      await:
        - id: verify
          uses: orun.http/probe@v1
          narrate: "Every live URL answered on the final probe."
          with:
            urls:
              - "https://{{ .inputs.repoName }}-site-api-stage.{{ .inputs.workersDevSubdomain }}.workers.dev/health"
              - "https://{{ .inputs.repoName }}-web-site-stage.{{ .inputs.workersDevSubdomain }}.workers.dev"
              - "https://{{ .inputs.repoName }}-site-api-prod.{{ .inputs.workersDevSubdomain }}.workers.dev/health"
              - "https://{{ .inputs.repoName }}-web-site-prod.{{ .inputs.workersDevSubdomain }}.workers.dev"
